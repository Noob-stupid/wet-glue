name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 .NET（C# 示例测试）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 全链路测试（39 项断言）
        run: bash tests/run.sh
